/* ============================================================
   "מחשבות על" – פיד פוסטים עם חיפוש וסינון
   הנתונים נקראים מהקובץ posts.json (לצד האתר).
   אם הקובץ לא נטען – משתמשים בעותק המובנה למטה.
   ============================================================ */
const FALLBACK_POSTS = {
  "updated": "2026-11-15",
  "tags": [
    "פמיניזם",
    "פוליטיקה כללית",
    "שמנופוביה",
    "בריאות הנפש",
    "אלימות נגד נשים",
    "מאבקים חברתיים",
    "נשים ופוליטיקה",
    "דימוי גוף חיובי",
    "הפרעות אכילה",
    "״לא סיפור כבד״ - הספר שלי",
    "סושיאל ויצירת תוכן",
    "חיים אישיים ומשפחה",
    "הומור ומחשבות",
    "אחר"
  ],
  "posts": []
};

function usePosts() {
  const [data, setData] = useState({ ...FALLBACK_POSTS, loading: true });
  useEffect(() => {
    let alive = true;
    fetch('posts.json', { cache: 'no-store' })
      .then(r => (r.ok ? r.json() : Promise.reject()))
      .then(j => {
        if (!alive || !j || !Array.isArray(j.posts)) return;
        // מכינים מראש טקסט מנורמל לחיפוש מהיר
        const posts = j.posts.map(p => ({ ...p, _hay: normalize(p.text + ' ' + (p.tags || []).join(' ')) }))
          .sort((a, b) => (a.date < b.date ? 1 : -1));
        setData({ updated: j.updated || FALLBACK_POSTS.updated, tags: j.tags || FALLBACK_POSTS.tags, posts, loading: false });
      })
      .catch(() => alive && setData(d => ({ ...d, loading: false, error: true })));
    return () => { alive = false; };
  }, []);
  return data;
}

const normalize = (str) => (str || '')
  .replace(/[֑-ׇ]/g, '')          // ניקוד וטעמים
  .replace(/[״"׳']/g, '')
  .toLowerCase();

function formatDate(iso) {
  try {
    return new Date(iso + 'T12:00:00').toLocaleDateString('he-IL', { day: 'numeric', month: 'long', year: 'numeric' });
  } catch (e) { return iso; }
}

/* הדגשת מילות החיפוש בתוך הטקסט */
function Highlight({ text, query }) {
  const q = query.trim();
  if (!q) return text;
  const words = q.split(/\s+/).filter(Boolean).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if (!words.length) return text;
  const re = new RegExp('(' + words.join('|') + ')', 'gi');
  return text.split(re).map((part, i) =>
    i % 2 === 1
      ? <mark key={i} className="bg-rose-400/25 text-cocoa rounded px-0.5">{part}</mark>
      : <React.Fragment key={i}>{part}</React.Fragment>
  );
}

/* שורת תגיות נגללת: דהייה בקצה + חץ שמראה שיש עוד */
function ChipsRow({ children }) {
  const ref = React.useRef(null);
  const [atEnd, setAtEnd] = useState(false);
  const [atStart, setAtStart] = useState(true);
  const check = () => {
    const el = ref.current; if (!el) return;
    const x = Math.abs(el.scrollLeft);
    setAtStart(x < 4);
    setAtEnd(x + el.clientWidth >= el.scrollWidth - 4);
  };
  useEffect(() => { check(); window.addEventListener('resize', check); return () => window.removeEventListener('resize', check); }, []);
  const nudge = (dir) => { const el = ref.current; if (el) el.scrollBy({ left: dir * 180, behavior: 'smooth' }); };
  return (
    <div className="relative">
      <div ref={ref} onScroll={check}
        className="flex gap-2 overflow-x-auto overscroll-x-contain snap-x scroll-px-5 px-5 py-3 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
        {children}
        <span className="shrink-0 w-6" aria-hidden="true"></span>
      </div>
      {/* דהייה + חץ בצד שמאל (המשך הרשימה) */}
      <div className={'pointer-events-none absolute inset-y-0 left-0 w-20 bg-gradient-to-r from-[#f7f0fc] via-[#f7f0fc]/80 to-transparent transition-opacity ' + (atEnd ? 'opacity-0' : 'opacity-100')}></div>
      <button type="button" onClick={() => nudge(-1)} aria-label="עוד תגיות"
        className={'absolute left-2 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-white shadow-md ring-1 ring-grape-100 text-grape-600 flex items-center justify-center transition-opacity ' + (atEnd ? 'opacity-0 pointer-events-none' : 'opacity-100 chip-nudge')}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4"><path d="M14.5 6l-6 6 6 6" /></svg>
      </button>
      {/* דהייה בצד ימין אחרי שגוללים */}
      <div className={'pointer-events-none absolute inset-y-0 right-0 w-10 bg-gradient-to-l from-[#f7f0fc] to-transparent transition-opacity ' + (atStart ? 'opacity-0' : 'opacity-100')}></div>
    </div>
  );
}

/* מונה תוצאות שמנוסח לפי מה שהמשתמש עושה */
function ResultsCount({ count, tags, query }) {
  const B = ({ children }) => <span className="font-bold text-grape-700">{children}</span>;
  if (!tags.length && !query) {
    return count === 1 ? <>מציג את הפוסט היחיד</> : <>מציג את כל <B>{count}</B> הפוסטים</>;
  }
  const lead = count === 0 ? <>לא נמצאו פוסטים</>
    : count === 1 ? <>נמצא <B>פוסט אחד</B></>
    : <>נמצאו <B>{count}</B> פוסטים</>;
  const multiWord = query.split(/\s+/).length > 1;
  return (
    <>
      {lead}
      {tags.length > 0 && <> תחת <B>{tags.join(' + ')}</B></>}
      {query && <> {count === 1 ? 'המכיל' : 'המכילים'} את {multiWord ? 'המילים' : 'המילה'} <B>'{query}'</B></>}
    </>
  );
}

              className={(query ? 'pl-12 ' : 'pl-3 ') + "w-full rounded-2xl bg-white border border-grape-100 focus:border-grape-500 focus:ring-4 focus:ring-grape-500/15 outline-none shadow-[0_8px_30px_-10px_rgba(107,33,168,0.25)] py-3.5 pr-[3.2rem] text-base sm:text-lg placeholder:text-[0.95rem] sm:placeholder:text-lg text-cocoa placeholder:text-grape-600/45 transition [&::-webkit-search-cancel-button]:hidden"} />
            {query && (
              <button type="button" onClick={() => setQuery('')} aria-label="ניקוי החיפוש"
                className="absolute z-10 inset-y-0 left-3 my-auto w-8 h-8 rounded-full text-grape-600 hover:bg-grape-100 flex items-center justify-center text-xl leading-none">×</button>
            )}
          </div>
        </div>
      </div>

      <div className="mx-auto max-w-2xl">
        {/* תגיות – שורה אופקית נגללת */}
        <ChipsRow>
          <Chip active={activeTags.length === 0} onClick={() => setActiveTags([])}>הכל</Chip>
          {tags.map(t => <Chip key={t} active={activeTags.includes(t)} onClick={() => toggleTag(t)}>{t}</Chip>)}
        </ChipsRow>

        <div className="px-5">
          <p className="text-sm text-cocoa/60 mb-4 mt-1" aria-live="polite">
            {loading ? "\u00a0" : <ResultsCount count={results.length} tags={activeTags} query={query.trim()} />}
          </p>
          <p className="text-xs text-cocoa/45 -mt-3 mb-5">מעודכן נכון ל־{formatDate(updated || new Date().toISOString().slice(0, 10))}</p>

          <div className="space-y-5">
            {results.slice(0, shown).map(p => (
              <PostCard key={p.id} post={p} query={query} activeTags={activeTags} onTag={toggleTag} />
            ))}
          </div>

          {loading && (
            <p className="text-center text-grape-600/80 py-10 flex items-center justify-center gap-3">
              <span className="typing inline-flex gap-[5px]"><i></i><i></i><i></i></span> טוענת את כל הדעות שלי…
            </p>
          )}

          {results.length > shown && (
            <div className="text-center mt-8">
              <button type="button" onClick={() => setShown(n => n + PAGE)}
                className="rounded-full bg-white border border-grape-300 text-grape-700 font-medium px-6 py-2.5 shadow-sm hover:border-grape-600 hover:shadow-md transition">
                עוד פוסטים ({results.length - shown} נשארו)
              </button>
            </div>
          )}

          {!loading && results.length === 0 && (
            <div className="text-center bg-white/70 rounded-3xl border-2 border-dashed border-grape-300 p-10 mt-2">
              <p className="font-hand text-rose-400 text-[2.4rem] leading-[0.9] mb-3">תפסת אותי בלי מילים</p>
              <p className="text-cocoa/70 mb-5">מסתבר שעל זה ספציפית <strong className="font-bold text-cocoa">עוד לא</strong> חפרתי (או שפשוט כדאי לנסות מילת חיפוש אחרת).</p>
              <button type="button" onClick={() => { setQuery(''); setActiveTags([]); }}
                className="rounded-full border-2 border-grape-600 text-grape-700 px-5 py-2 font-medium hover:bg-grape-600 hover:text-white transition-colors">
                הצגת כל הפוסטים
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* אבק כוכבים: נקודות זהב קטנות שמנצנצות בהשהיות שונות (מיקומים קבועים) */
function Sparkles({ count = 46 }) {
  const dots = React.useMemo(() => {
    let seed = 7;
    const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    return Array.from({ length: count }, (_, i) => ({
      top: rnd() * 100, left: rnd() * 100,
      size: 1.5 + rnd() * 3.5,
      delay: rnd() * 6, dur: 2.5 + rnd() * 4,
      star: i % 7 === 0,
    }));
  }, [count]);
  return (
    <div className="pointer-events-none absolute inset-0 overflow-hidden" aria-hidden="true">
      {dots.map((d, i) => d.star ? (
        <svg key={i} viewBox="0 0 24 24" className="sparkle absolute text-amber-200"
          style={{ top: d.top + '%', left: d.left + '%', width: d.size * 4, height: d.size * 4, animationDelay: d.delay + 's', animationDuration: d.dur + 's' }}>
          <path fill="currentColor" d="M12 0c.6 5.6 1.9 8.6 3.6 9.9 1.6 1.2 4.4 1.8 8.4 2.1-4 .3-6.8.9-8.4 2.1C13.9 15.4 12.6 18.4 12 24c-.6-5.6-1.9-8.6-3.6-9.9C6.8 12.9 4 12.3 0 12c4-.3 6.8-.9 8.4-2.1C10.1 8.6 11.4 5.6 12 0z" />
        </svg>
      ) : (
        <span key={i} className="sparkle absolute rounded-full bg-amber-200"
          style={{ top: d.top + '%', left: d.left + '%', width: d.size, height: d.size, animationDelay: d.delay + 's', animationDuration: d.dur + 's', boxShadow: `0 0 ${d.size * 3}px rgba(253,224,71,.8)` }} />
      ))}
    </div>
  );
}

  const [zoomed, setZoomed] = useState(null);
  const total = items.length;
  const go = (delta) => setCurrentArtIndex(i => (i + delta + total) % total);
  const next = () => go(1);
  const prev = () => go(-1);

  // מקלדת: חץ שמאלה = הבא, חץ ימינה = הקודם (כיוון קריאה עברי)
  useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'Escape') setZoomed(null);
      if (e.key === 'ArrowLeft') next();
      if (e.key === 'ArrowRight') prev();
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [total]);

  // החלקה באצבע
  const touch = React.useRef(null);
  const onTouchStart = (e) => { touch.current = e.touches[0].clientX; };
  const onTouchEnd = (e) => {
    if (touch.current == null) return;
    const dx = e.changedTouches[0].clientX - touch.current;
    if (Math.abs(dx) > 45) (dx > 0 ? next : prev)();   // החלקה ימינה = הבא, כמו דפדוף בספר עברי
    touch.current = null;
  };

  const art = items[currentArtIndex];
  return (
    <section className="mt-7" aria-roledescription="קרוסלה" aria-label="יצירות בתערוכה">
      <div className="mx-auto w-full max-w-[17.75rem] sm:max-w-[22rem]" onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
        <div key={art.id} className="art-enter">
          <Artwork art={art} onZoom={setZoomed}
            frameSide={<>
              {/* חצים צמודים לצידי המסגרת – תמיד באותו גובה של התמונה */}
              <GoldArrow dir="prev" onClick={prev} label="היצירה הקודמת" className="absolute top-1/2 -translate-y-1/2 -right-[2.6rem] sm:-right-20" />
              <GoldArrow dir="next" onClick={next} label="היצירה הבאה" className="absolute top-1/2 -translate-y-1/2 -left-[2.6rem] sm:-left-20" />
            </>}
            between={
              <div className="mt-4 flex flex-col items-center gap-1.5">
                <div className="flex items-center gap-2" role="tablist" aria-label="בחירת יצירה">
                  {items.map((it, i) => (
                    <button key={it.id} type="button" role="tab" aria-selected={i === currentArtIndex}
                      aria-label={'יצירה ' + (i + 1)} onClick={() => setCurrentArtIndex(i)}
                      className={'h-2 rounded-full transition-all duration-300 ' +
                        (i === currentArtIndex ? 'w-6 bg-gradient-to-l from-amber-200 to-amber-400 shadow-[0_0_10px_rgba(251,191,36,0.6)]' : 'w-2 bg-amber-100/25 hover:bg-amber-100/50')} />
                  ))}
                </div>
                <p className="font-museum text-[0.8rem] tracking-wide text-[#cbb98f]/80" aria-live="polite">
                  {currentArtIndex + 1} מתוך {total}
                </p>
                <span className="hint-bounce mt-1 flex flex-col items-center text-amber-200/70 font-museum text-[0.72rem]" aria-hidden="true">
                  שלט היצירה
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4"><path d="M6 9.5l6 6 6-6" /></svg>
                </span>
              </div>
            } />
        </div>
      </div>

      {/* תצוגה מוגדלת */}
      {zoomed && (
        <div className="fixed inset-0 z-[60] bg-black/90 backdrop-blur-sm flex flex-col items-center justify-center p-4 fade-in"
          onClick={() => setZoomed(null)} role="dialog" aria-modal="true" aria-label={zoomed.title}>
          {zoomed.comment
            ? <div className="w-full max-w-md shadow-2xl ring-1 ring-amber-200/30 rounded-lg"><CommentCard c={zoomed.comment} big /></div>
            : zoomed.xpost
            ? <div className="w-full max-w-md shadow-2xl ring-1 ring-amber-200/30 rounded-lg"><XPostCard x={zoomed.xpost} big /></div>
            : zoomed.chat
            ? <div className="w-full max-w-md max-h-[78vh] overflow-y-auto shadow-2xl ring-1 ring-amber-200/30 rounded-lg" onClick={e => e.stopPropagation()}><ChatCard chat={zoomed.chat} big /></div>
            : <img src={zoomed.image} alt={'צילום מסך: ' + zoomed.title} className="max-w-full max-h-[78vh] object-contain rounded shadow-2xl ring-1 ring-amber-200/30" />}
          <p className="mt-4 font-museum text-[#f3e6c4] text-center">{zoomed.title}, {zoomed.year}</p>
          <button type="button" className="mt-3 text-[0.85rem] text-amber-200/80 underline underline-offset-4">סגירה</button>
        </div>
      )}
    </section>
  );
}

function MuseumPage() {
  return (
    <div className="fade-in relative overflow-hidden bg-[#0d0b10] min-h-[85vh]">
      {/* אור "זרקורים" רך מלמעלה */}
      <div className="pointer-events-none absolute inset-0 bg-[radial-gradient(ellipse_at_top,rgba(251,191,36,0.13),transparent_55%)]" aria-hidden="true"></div>
      <div className="pointer-events-none absolute inset-0 bg-[radial-gradient(ellipse_at_bottom,rgba(147,51,234,0.12),transparent_60%)]" aria-hidden="true"></div>
      <Sparkles />

      <div className="relative mx-auto max-w-3xl px-3 pt-7 pb-16 sm:pt-12">
        <header className="text-center max-w-2xl mx-auto">
          <p className="font-museum tracking-[0.35em] text-[0.65rem] sm:text-xs text-amber-200/60 mb-2">✦ תערוכת קבע ✦</p>
          <h2 className="gold-text font-museum font-black text-[2rem] sm:text-[3.4rem] leading-[1.05]">מוזיאון הגועל</h2>
          <div className="mx-auto my-3 h-px w-24 bg-gradient-to-l from-transparent via-amber-300/70 to-transparent" aria-hidden="true"></div>
          <p className="font-museum italic text-[0.88rem] sm:text-[1.05rem] leading-[1.55] text-[#d8c38e]/85 px-2">
            תראו, רוב התגובות שאני מקבלת הן מדהימות, עוטפות ומרגשות. אבל הקקי הנותר? החרא הזה פשוט היה חייב תיעוד, אחרת לא הייתם מאמינים לי שזה אמיתי.
          </p>
        </header>

        <Carousel items={EXHIBITS} />
      </div>
    </div>
  );
}

/* ---------- ניווט ---------- */
const TABS = [
  { id: 'home', label: 'הכל פה' },
  { id: 'archive', label: 'מחשבות על' },
  { id: 'museum', label: 'המוזיאון' },
];

function readHash() {
  const h = (location.hash || '').replace('#', '');
  return TABS.some(t => t.id === h) ? h : 'home';
}

function NavBar({ active, onChange }) {
  return (
    <nav className="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-grape-100 shadow-sm">
      <div className="mx-auto max-w-2xl px-3 sm:px-4 py-2.5 flex flex-wrap items-center justify-between gap-x-2 gap-y-2">
        <span className="title-glitch font-hand text-[2.7rem] sm:text-[3.1rem] leading-none shrink-0 -my-2 -translate-y-[0.2em]">מאיה לי לוי</span>
        <div className="flex ms-auto bg-grape-100/80 rounded-full p-1" role="tablist">
          {TABS.map(t => (
            <button key={t.id} role="tab" aria-selected={active === t.id}
              onClick={() => onChange(t.id)}
              className={'whitespace-nowrap px-2.5 sm:px-5 py-1.5 rounded-full text-[0.82rem] sm:text-base font-medium transition-all ' +
                (active === t.id ? 'bg-gradient-to-l from-grape-600 to-rose-400 text-white shadow' : 'text-grape-700 hover:bg-white/70')}>
              {t.label}
            </button>
          ))}
        </div>
      </div>
    </nav>
  );
}

function Footer({ flush = false }) {
  return (
    <footer className={'relative bg-[#efe3f8] border-t border-grape-300/50 ' + (flush ? '' : 'mt-16')}>
      {/* קו עדין בגרדיאנט סגול-ורוד בראש הפוטר */}
      <div className="absolute top-0 inset-x-0 h-[2px] bg-gradient-to-l from-transparent via-grape-500/40 to-transparent" aria-hidden="true"></div>
      <div className="mx-auto max-w-2xl px-5 pt-8 pb-9 text-center">
        <p className="text-[0.85rem] sm:text-sm text-cocoa/65 leading-relaxed">
          ארכיון של חפירות, דעות ואקטיביזם. כל הזכויות שמורות למאיה לי לוי ©
        </p>
        <nav className="mt-2 flex items-center justify-center gap-2 text-xs sm:text-[0.8rem] text-grape-600/70" aria-label="קישורים משפטיים">
          <a href={LINKS.accessibility} className="hover:text-grape-700 hover:underline underline-offset-4 transition-colors">הצהרת נגישות</a>
          <span className="text-grape-300" aria-hidden="true">|</span>
          <a href={LINKS.privacy} className="hover:text-grape-700 hover:underline underline-offset-4 transition-colors">מדיניות פרטיות ותנאי שימוש</a>
        </nav>
      </div>
    </footer>
  );
}

function App() {
  const [tab, setTab] = useState(readHash());
  useEffect(() => {
    const onHash = () => setTab(readHash());
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  const change = (id) => {
    setTab(id);
    try { history.replaceState(null, '', '#' + id); } catch (e) {}
  };
  /* בכל מעבר לשונית – חוזרים מיד לראש העמוד (אחרי שהתוכן החדש הוצג) */
  React.useLayoutEffect(() => {
    const toTop = () => {
      window.scrollTo(0, 0);
      if (document.scrollingElement) document.scrollingElement.scrollTop = 0;
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
    };
    toTop();
    const raf = requestAnimationFrame(toTop);
    return () => cancelAnimationFrame(raf);
  }, [tab]);
  return (
    <div className="min-h-screen flex flex-col font-body">
      <NavBar active={tab} onChange={change} />
      <main className="flex-1">{tab === 'home' ? <HomePage /> : tab === 'archive' ? <ArchivePage /> : <MuseumPage />}</main>
      <Footer flush={tab !== 'archive'} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
